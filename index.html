<head>
<meta charset="utf-8">

<title>Semana de Nivelación · IENC Sede San Nicolás</title>
<style>
:root{--azul:#1F3864;--azul2:#2F5597;--celeste:#DDEBF7;--nar:#FCE4D6;--nar2:#C55A11;--nar3:#843C0C;--ver:#E2EFDA;--ver2:#548235;--ver3:#385723;--ama:#FFF2CC;--ama2:#BF9000;--gris:#EDEDED;--txt:#1d1d1f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);background:#f5f6f8}
header{background:var(--azul);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center}
header img{height:52px;background:#fff;border-radius:8px;padding:3px}
header h1{font-size:19px;margin:0} header p{margin:2px 0 0;font-size:13px;opacity:.9}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
nav button{flex:none;border:0;border-radius:20px;padding:9px 15px;font-size:15px;background:#eef1f6;color:var(--azul);font-weight:600;cursor:pointer}
nav button.on{background:var(--azul);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
label.l{display:block;font-weight:700;margin-bottom:6px;color:var(--azul)}
select,input[type=text],input[type=password]{width:100%;font-size:17px;padding:11px;border:2px solid #cfd6e4;border-radius:10px;background:#fff}
.days{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
.days button{flex:none;border:2px solid var(--azul);background:#fff;color:var(--azul);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.days button.on{background:var(--azul);color:#fff}
.blk{border-radius:12px;overflow:hidden;margin-bottom:10px;border:2px solid #d9dfea;background:#fff}
.bh{background:var(--celeste);padding:8px 12px;font-weight:800;color:var(--azul);display:flex;justify-content:space-between;gap:8px}
.ar{padding:8px 12px;font-weight:800;color:var(--azul);font-size:17px}.cmp{font-weight:400;font-size:13px;color:#555}
.yes{background:var(--nar);border-left:8px solid var(--nar2);padding:9px 12px;color:var(--nar3);font-size:17px}
.no{background:var(--ver);border-left:8px solid var(--ver2);padding:9px 12px;color:var(--ver3);font-size:16px}
.small{font-size:13px;color:#444;margin-top:2px}
.desc{background:var(--ama);text-align:center;font-weight:800;padding:8px;border-radius:10px;margin-bottom:10px}
.lleg{background:var(--celeste);padding:10px 12px;border-radius:10px;margin-bottom:10px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.step{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.35}
.s1{background:var(--celeste);border-left:6px solid var(--azul2)}.s2{background:var(--nar);border-left:6px solid var(--nar2)}.s3{background:var(--ver);border-left:6px solid var(--ver2)}.s4{background:var(--ama);border-left:6px solid var(--ama2)}
.big{font-size:28px;font-weight:900;color:var(--azul)}
.tc{padding:10px 12px}.tc.sus{background:var(--nar)}.tc.base{background:var(--ver)}.tc.apoyo{background:var(--ama)}.tc.libre,.tc.noasiste{background:var(--gris);color:#777;font-style:italic;text-align:center}
.rm{font-size:22px;font-weight:900;color:var(--azul)}
.act{margin-top:6px;background:rgba(255,255,255,.7);border-radius:6px;padding:5px 8px;font-weight:700;color:var(--azul);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}th{background:var(--azul);color:#fff;padding:7px;text-align:left}td{border-bottom:1px solid #e3e3e3;padding:7px;vertical-align:top}
.tbl{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:700}
.p-s{background:var(--nar);color:var(--nar3)}.p-b{background:var(--ver);color:var(--ver3)}.p-a{background:var(--ama);color:#7f6000}
.lock{text-align:center}.lock .big{font-size:40px}
.btn{border:0;background:var(--azul);color:#fff;border-radius:10px;padding:11px 18px;font-size:16px;font-weight:700;cursor:pointer}
.btn.sec{background:#eef1f6;color:var(--azul)}
.err{color:#b00020;font-weight:700;margin-top:8px}
.res{padding:10px 12px;border:2px solid #e3e7ef;border-radius:10px;margin-top:6px;cursor:pointer;background:#fff}.res:hover{border-color:var(--azul2)}
.warn{background:#fdecea;border-left:6px solid #b00020;padding:10px 12px;border-radius:8px;font-weight:700;color:#7a0016}
.star{color:#c08000;font-weight:900}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.muted{color:#666;font-size:13px}
.note{font-size:13px;color:#555;margin-top:10px}
@media print{nav,header,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>

const DRIVE_URL=""; // ← pega aquí el enlace de la carpeta de Google Drive (planillas PDF). Déjalo vacío para ocultar el botón.
const TABS=[["curso","📚 Curso"],["docente","👩‍🏫 Docente"],["grado","🎓 Grado"],["salon","🏫 Salón"],["ahora","⏱️ Ahora"],["privado","🔒 Docentes"]];
let tab="curso",dayIdx=0,PRIV=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cl=a=>a.length>1?a.slice(0,-1).join(", ")+" y "+a[a.length-1]:a[0];
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const GRADES=Object.keys(PUB.grades);
const COURSES=Object.keys(PUB.courses).sort((a,b)=>a-b);
const TEACH=Object.keys(PUB.teachers).sort();
const ROOMS=Object.keys(PUB.rooms).sort((a,b)=>a-b);
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function navDraw(){$("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join("")}
function go(k){tab=k;navDraw();render()}
function dayBar(){return `<div class="days">${PUB.days.map((d,i)=>`<button class="${i===dayIdx?'on':''}" onclick="dayIdx=${i};render()">${d}</button>`).join("")}</div>`}
function curSlot(){const now=new Date();const iso=now.toLocaleDateString("sv-SE",{timeZone:"America/Bogota"});const hm=now.toLocaleTimeString("en-GB",{timeZone:"America/Bogota",hour:"2-digit",minute:"2-digit"});const d=PUB.dates.indexOf(iso);if(d<0)return null;for(let b=0;b<4;b++){const[s,e]=PUB.hstart[b];if(hm>=s&&hm<e)return[d,b]}return[d,-1]}
(function(){const c=curSlot();if(c)dayIdx=c[0]})();
const slot=(d,b)=>d*4+b;
function blockHead(b){return `<div class="bh"><span>${PUB.hours[b]}</span></div>`}
function descanso(){return `<div class="desc">☕ 8:50 – 9:20 · DESCANSO</div>`}
// ---------- CURSO
function vCurso(){
  const c=store("curso")||COURSES[0];
  let h=`<div class="card"><label class="l">Elige tu curso</label><select onchange="store('curso',this.value);render()">${COURSES.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join("")}</select></div>`;
  const C=PUB.courses[c],G=PUB.grades[C.grade];
  h+=`<div class="card"><div class="steps">
  <div class="step s1"><b>1️⃣ Llega a tu salón base</b><div class="big">Salón ${C.base}</div>Al iniciar el día y al iniciar cada bloque.</div>
  <div class="step s2"><b>2️⃣ Mira el área del bloque</b><br><b>¿La DEBES?</b> ➜ vas al salón de sustentación (naranja).<br><b>¿NO la debes?</b> ➜ te quedas en tu salón base (verde).</div>
  <div class="step s3"><b>3️⃣ Termina el bloque</b><br>Regresas a tu <b>salón base</b> y se repite el paso 1.<br><b>Nunca te quedes en los pasillos.</b></div></div></div>`;
  h+=dayBar()+`<div class="lleg">🏫 <b>6:00 – 6:15 · LLEGADA:</b> llegas a tu <b>salón base (Salón ${C.base})</b>. Espera indicaciones del docente que llega al aula.</div>`;
  for(let b=0;b<4;b++){
    if(b===2)h+=descanso();
    const cell=G.cells[slot(dayIdx,b)];
    const sr=cell.split?cell.sus.find(x=>x.courses.includes(c)).room:cell.sus[0].room;
    const bg=cell.base.find(x=>x.courses.includes(c));
    h+=`<div class="blk">${blockHead(b)}<div class="ar">${esc(cell.area)}${cell.comp?`<div class="cmp">(${esc(cell.comp)})</div>`:""}</div>
    <div class="yes">¿La DEBES? ➜ <b>Salón ${sr}</b></div>
    <div class="no">¿NO la debes? ➜ te quedas en el <b>Salón ${bg.room}</b><div class="small">${esc(bg.subj[c].join(", "))} y demás materias</div></div></div>`;
  }
  h+=`<p class="note">Las actividades de nivelación incluyen trabajo en casa, trabajo en el colegio y evaluaciones de sustentación. Ningún estudiante puede estar fuera de su salón.</p>`;
  return h;
}
// ---------- DOCENTE
function tcell(x){
  if(x.kind==="libre")return `<div class="tc libre">Libre</div>`;
  if(x.kind==="noasiste")return `<div class="tc noasiste">No asiste</div>`;
  if(x.kind==="sus"){const rr=x.rooms[0]===x.rooms[1]?`Salón ${x.rooms[0]}`:`Salón ${x.rooms[0]} → ${x.rooms[1]}`;
    return `<div class="tc sus"><span class="pill p-s">✏️ SUSTENTAS</span><div class="rm">${rr}</div><b>${esc(x.gl)}</b> · Sustentación ${esc(x.area)}<div class="small">${x.n?x.n+" est.":""}${x.shared||x.n!==x.mine?` (${x.mine} ${x.mine===1?"tuyo":"tuyos"})`:""}</div>${x.rooms[0]!==x.rooms[1]?`<div class="small"><b>1.er turno salón ${x.rooms[0]} · 2.º turno salón ${x.rooms[1]}</b></div>`:""}<div class="act">➜ Busca a tus estudiantes en ${x.fetch.length>1?"los salones base":"el salón base"} ${x.fetch.join(" y ")}</div></div>`}
  if(x.kind==="base")return `<div class="tc base"><span class="pill p-b">🏫 CUIDAS</span><div class="rm">Salón ${x.room}</div><b>${esc(cl(x.courses))}</b> · Acompañamiento<div class="small">${x.n} est.${x.mine?` (${x.mine} ${x.mine===1?"debe":"deben"} nivelar contigo)`:""}</div><div class="act">➜ Envía a quienes deben ${esc(x.area)} al salón ${x.send}</div></div>`;
  if(x.kind==="apoyo")return `<div class="tc apoyo"><span class="pill p-a">🤝 APOYO</span><div class="rm">Salón ${x.rooms[0]} → ${x.rooms[1]}</div><b>${esc(x.gl)}</b> · Apoyo ${esc(x.area)}<div class="act">➜ Cuidas el salón que espera turno; a mitad del bloque te cambias</div></div>`;
}
function vDocente(){
  const t=store("docente")||TEACH[0];
  let h=`<div class="card"><label class="l">Elige tu nombre</label><select onchange="store('docente',this.value);render()">${TEACH.map(x=>`<option ${x===t?'selected':''}>${esc(x)}</option>`).join("")}</select></div>`;
  h+=`<div class="card"><b style="color:var(--azul)">🔄 CADA BLOQUE FUNCIONA IGUAL</b><div class="steps" style="margin-top:8px">
  <div class="step s3"><b>🏫 Si CUIDAS:</b> en tu salón base, envía a los estudiantes que deben el área al salón de sustentación. Acompañas al grupo; si hay quienes deben tu asignatura, avanza con ellos. <b>Nadie sale del salón.</b></div>
  <div class="step s2"><b>✏️ Si SUSTENTAS:</b> ve al salón base, busca a tus estudiantes y llévalos a tu salón. Solo están quienes deben el área: aplicas <b>actividades evaluativas</b>.</div>
  <div class="step s1"><b>↩️ Al final del bloque:</b> todos los estudiantes regresan a su salón base. El ciclo se repite.</div>
  <div class="step s4"><b>🤝 Si eres APOYO:</b> cuidas el salón que espera turno; a mitad del bloque te cambias con el docente del área.</div></div></div>`;
  h+=dayBar()+`<div class="lleg">🕕 <b>6:00 – 6:15 · LLEGADA:</b> los estudiantes entran a su salón base. Aplica el <b>paso 1</b> de tu primer bloque.</div>`;
  const cells=PUB.teachers[t].cells;
  for(let b=0;b<4;b++){if(b===2)h+=descanso();h+=`<div class="blk">${blockHead(b)}${tcell(cells[slot(dayIdx,b)])}</div>`}
  h+=`<p class="note"><b>Todo estudiante debe tener un docente responsable.</b> Está prohibido enviar estudiantes a buscar docentes o dejarlos sin acompañamiento.</p>`;
  return h;
}
// ---------- GRADO
function vGrado(){
  const g=store("grado")||GRADES[0];
  let h=`<div class="card"><label class="l">Elige el grado</label><select onchange="store('grado',this.value);render()">${GRADES.map(x=>`<option value="${x}" ${x===g?'selected':''}>${PUB.grades[x].label}</option>`).join("")}</select>
  <div class="small" style="margin-top:8px">Salones base: ${PUB.grades[g].groups.map(x=>`<b>${cl(x.courses)}</b> → Salón ${x.base}`).join(" · ")}</div></div>`+dayBar();
  for(let b=0;b<4;b++){
    if(b===2)h+=descanso();
    const c=PUB.grades[g].cells[slot(dayIdx,b)];
    h+=`<div class="blk">${blockHead(b)}<div class="ar">${esc(c.area)}${c.comp?`<div class="cmp">(${esc(c.comp)})</div>`:""}</div>
    <div class="yes"><b>Sustentación (${c.n} est.):</b> ${c.sus.map(s=>`${c.split?esc(cl(s.courses))+" → ":""}Salón ${s.room} (${s.n})`).join(" · ")}<div class="small">${c.teachers.map(t=>esc(t.t)+" ("+t.n+")"+(t.rooms[0]!==t.rooms[1]?` ${t.rooms[0]}→${t.rooms[1]}`:"")).join(" · ")}${c.apoyo?` · Apoyo: ${esc(c.apoyo)}`:""}</div></div>
    <div class="no"><b>Salones base:</b> ${c.base.map(x=>`Salón ${x.room} (${esc(cl(x.courses))}, ${x.n} est.) – ${esc(x.t)}`).join(" · ")}</div></div>`;
  }
  return h;
}
// ---------- SALÓN
function roomOcc(r,d,b){
  const out=[];
  for(const t of TEACH){const x=PUB.teachers[t].cells[slot(d,b)];
    if(x.kind==="sus"&&x.rooms.includes(r))out.push({t,k:"S",x,turn:x.rooms[0]===x.rooms[1]?"":(x.rooms[0]===r?"1.er turno":"2.º turno")});
    if(x.kind==="base"&&x.room===r)out.push({t,k:"B",x});
    if(x.kind==="apoyo"&&x.rooms.includes(r))out.push({t,k:"A",x,turn:x.rooms[0]===r?"1.er turno":"2.º turno"});}
  return out;
}
function occHtml(o){return o.length?o.map(z=>`<div style="margin:3px 0"><span class="pill ${z.k==='S'?'p-s':z.k==='B'?'p-b':'p-a'}">${z.k==='S'?'Sustentación':z.k==='B'?'Base':'Apoyo'}</span> <b>${esc(z.t)}</b> · ${esc(z.x.gl||"")} ${z.k==='S'?esc(z.x.area):z.k==='B'?esc(cl(z.x.courses)):esc(z.x.area)} ${z.turn?`<span class="muted">(${z.turn})</span>`:""}</div>`).join(""):`<span class="muted">Sin uso</span>`}
function vSalon(){
  const r=store("salon")||ROOMS[0];
  let h=`<div class="card"><label class="l">Elige el salón</label><select onchange="store('salon',this.value);render()">${ROOMS.map(x=>`<option value="${x}" ${x===r?'selected':''}>Salón ${x} · ${PUB.rooms[x].grade} · ${PUB.rooms[x].type}</option>`).join("")}</select></div>`+dayBar();
  for(let b=0;b<4;b++){if(b===2)h+=descanso();h+=`<div class="blk">${blockHead(b)}<div class="tc">${occHtml(roomOcc(r,dayIdx,b))}</div></div>`}
  return h;
}
// ---------- AHORA
function vAhora(){
  const c=curSlot();let d=dayIdx,b=+(store("ahoraB")||0),live=false;
  if(c&&c[1]>=0){d=c[0];b=c[1];live=true}
  let h=`<div class="card">${live?`<b>🔴 En este momento:</b> ${PUB.days[d]} · ${PUB.hours[b]}`:`<b>Fuera del horario de nivelación.</b> Elige día y bloque:`}</div>`;
  if(!live)h+=dayBar()+`<div class="days">${PUB.hours.map((x,i)=>`<button class="${i===b?'on':''}" onclick="store('ahoraB',${i});render()">${x}</button>`).join("")}</div>`;
  h+=`<div class="card tbl"><table><tr><th>Salón</th><th>Grado</th><th>Quién está</th></tr>${ROOMS.map(r=>`<tr><td><b>${r}</b></td><td>${PUB.rooms[r].grade}</td><td>${occHtml(roomOcc(r,live?d:dayIdx,b))}</td></tr>`).join("")}</table></div>`;
  return h;
}
// ---------- PRIVADO
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){
  const pw=$("#pw").value;$("#perr").textContent="Verificando…";
  try{const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
    PRIV=JSON.parse(new TextDecoder().decode(pt));render();
  }catch(e){$("#perr").textContent="Contraseña incorrecta."}
}
let pv="buscar";
function vPrivado(){
  if(!PRIV)return `<div class="card lock"><div class="big">🔒</div><p>Sección exclusiva para docentes y coordinación.<br>Contiene información académica de estudiantes menores de edad.</p>
  <input type="password" id="pw" placeholder="Contraseña" onkeydown="if(event.key==='Enter')unlock()"><p><button class="btn" onclick="unlock()">Entrar</button></p><div class="err" id="perr"></div></div>`;
  let h=`<div class="warn noprint">⚠️ Información confidencial de menores de edad. No compartas capturas ni la contraseña.</div>
  <div class="days noprint">${[["buscar","🔍 Buscar estudiante"],["lista","📋 Lista por salón"],["riesgo","📊 Consolidado"]].map(([k,l])=>`<button class="${pv===k?'on':''}" onclick="pv='${k}';render()">${l}</button>`).join("")}
  ${DRIVE_URL?`<a class="btn sec" style="text-decoration:none" href="${DRIVE_URL}" target="_blank">📂 Planillas PDF</a>`:""}<button class="btn sec" onclick="PRIV=null;render()">Cerrar sesión</button></div>`;
  if(pv==="buscar")h+=pBuscar();if(pv==="lista")h+=pLista();if(pv==="riesgo")h+=pRiesgo();
  return h;
}
let q="",selSt=null;
function pBuscar(){
  let h=`<div class="card"><label class="l">Nombre o apellido</label><input type="text" id="q" value="${esc(q)}" placeholder="Ej: ocando" oninput="q=this.value;selSt=null;drawRes()"><div id="resl"></div></div><div id="ficha"></div>`;
  setTimeout(drawRes,0);return h;
}
function drawRes(){
  const el=$("#resl");if(!el)return;const n=norm(q.trim());
  if(selSt!==null){$("#ficha").innerHTML=ficha(PRIV.students[selSt]);el.innerHTML="";return}
  $("#ficha").innerHTML="";
  if(n.length<2){el.innerHTML=`<p class="muted">Escribe al menos 2 letras.</p>`;return}
  const r=PRIV.students.map((s,i)=>[s,i]).filter(([s])=>norm(s.n).includes(n)).slice(0,30);
  el.innerHTML=r.length?r.map(([s,i])=>`<div class="res" onclick="selSt=${i};drawRes()"><b>${esc(s.n)}</b> · ${s.c} <span class="muted">· debe ${s.areas.length} área(s)</span></div>`).join(""):`<p class="muted">Sin resultados entre los estudiantes citados.</p>`;
}
function ficha(s){
  const nsub=s.areas.reduce((a,x)=>a+x.s.length,0),C=PUB.courses[s.c];
  let h=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div class="big" style="font-size:22px">${esc(s.n)}</div><b>${s.c}</b> · Salón base <b>${C.base}</b>${s.i?' · <span class="pill p-a">Inclusión</span>':""}</div>
  <div style="text-align:right"><div class="big" style="color:#b00020">${s.areas.length}</div><div class="muted">área(s) · ${nsub} asignatura(s)</div></div></div>
  <div class="tbl" style="margin-top:10px"><table><tr><th>Área</th><th>Prom.</th><th>Asignaturas pendientes (nota · docente)</th></tr>${s.areas.map(a=>`<tr><td>${esc(a.a)}</td><td><b>${a.p.toFixed(1)}</b></td><td>${a.s.map(x=>`${esc(x[0])} <b>${(+x[1]).toFixed(1)}</b> <span class="muted">· ${esc(x[2]||"")}</span>`).join("<br>")}</td></tr>`).join("")}</table></div></div>`;
  h+=`<div class="card"><b style="color:var(--azul)">📅 Su semana</b><div class="tbl"><table><tr><th>Día</th>${PUB.hours.map(x=>`<th>${x}</th>`).join("")}</tr>${PUB.days.map((d,di)=>`<tr><td><b>${d}</b></td>${[0,1,2,3].map(b=>{const r=s.route[slot(di,b)];return r.k==="S"?`<td style="background:var(--nar)">✏️ <b>Salón ${r.r}</b><br><span class="small">${esc(r.a)}</span></td>`:`<td style="background:var(--ver)">🏫 Salón ${r.r}<br><span class="small">${esc(r.t[0])}</span></td>`}).join("")}</tr>`).join("")}</table></div>
  <button class="btn sec noprint" style="margin-top:10px" onclick="window.print()">🖨️ Imprimir</button></div>`;
  return h;
}
let lr=null,lb=0;
function pLista(){
  if(lr===null)lr=ROOMS[0];
  let h=`<div class="card noprint grid2"><div><label class="l">Salón</label><select onchange="lr=this.value;render()">${ROOMS.map(x=>`<option value="${x}" ${x===lr?'selected':''}>Salón ${x} · ${PUB.rooms[x].grade} · ${PUB.rooms[x].type}</option>`).join("")}</select></div>
  <div><label class="l">Bloque</label><select onchange="lb=+this.value;render()">${PUB.hours.map((x,i)=>`<option value="${i}" ${i===lb?'selected':''}>${x}</option>`).join("")}</select></div></div>`+`<div class="noprint">${dayBar()}</div>`;
  const i=slot(dayIdx,lb),occ=roomOcc(lr,dayIdx,lb);
  const st=PRIV.students.filter(s=>s.route[i].r===lr);
  const isSus=st.length&&st[0].route[i].k==="S";
  h+=`<div class="card"><b>Salón ${lr}</b> · ${PUB.days[dayIdx]} · ${PUB.hours[lb]}<div style="margin:6px 0">${occHtml(occ)}</div>`;
  if(!st.length){h+=`<p class="muted">No hay estudiantes asignados.</p></div>`;return h}
  const resp=occ.filter(z=>z.k==="B").map(z=>z.t);
  h+=`<div class="tbl"><table><tr><th>☐</th><th>N°</th><th>Curso</th><th>Estudiante</th>${isSus?"<th>Asignatura pendiente</th><th>Nota</th>":"<th>Debe nivelar con el responsable</th>"}</tr>`;
  st.sort((a,b)=>a.c-b.c||a.n.localeCompare(b.n)).forEach((s,k)=>{
    const r=s.route[i];let extra="";
    if(isSus){const ars=r.a.split(' / ');const subs=s.areas.filter(a=>ars.includes(a.a)).flatMap(a=>a.s).filter(x=>r.t.includes(x[2]));extra=`<td>${subs.map(x=>esc(x[0])).join("<br>")}</td><td>${subs.map(x=>(+x[1]).toFixed(1)).join("<br>")}</td>`}
    else{const subs=s.areas.flatMap(a=>a.s).filter(x=>resp.includes(x[2]));extra=`<td>${subs.length?`<span class="star">⭐</span> `+subs.map(x=>esc(x[0])+" "+(+x[1]).toFixed(1)).join(", "):"—"}</td>`}
    h+=`<tr><td>☐</td><td>${k+1}</td><td>${s.c}</td><td>${esc(s.n)}</td>${extra}</tr>`});
  h+=`</table></div><p class="muted">Total: ${st.length} estudiantes.</p><button class="btn sec noprint" onclick="window.print()">🖨️ Imprimir</button></div>`;
  return h;
}
let rf=1,rc="";
function pRiesgo(){
  let h=`<div class="card noprint grid2"><div><label class="l">Curso</label><select onchange="rc=this.value;render()"><option value="">Todos</option>${COURSES.map(c=>`<option ${c===rc?'selected':''}>${c}</option>`).join("")}</select></div>
  <div><label class="l">Estudiantes que deben</label><select onchange="rf=+this.value;render()">${[[1,"1 o más áreas (todos)"],[3,"3 o más áreas"],[5,"5 o más áreas"],[99,"todas sus áreas"]].map(([v,l])=>`<option value="${v}" ${v===rf?'selected':''}>${l}</option>`).join("")}</select></div></div>`;
  const list=PRIV.students.filter(s=>(!rc||s.c===rc)&&(rf===99?s.areas.length>=s.ta:s.areas.length>=rf));
  const nas=list.reduce((a,s)=>a+s.areas.reduce((b,x)=>b+x.s.length,0),0);
  h+=`<div class="card"><b>Consolidado${rc?" · "+rc:""}</b> · ${list.length} estudiantes · ${nas} asignaturas pendientes<div class="tbl"><table><tr><th>Curso</th><th>Estudiante</th><th>Áreas</th><th>Asig.</th><th>Áreas y asignaturas pendientes (nota)</th></tr>${list.sort((a,b)=>a.c-b.c||a.n.localeCompare(b.n)).map(s=>`<tr><td>${s.c}</td><td style="cursor:pointer;color:var(--azul2);font-weight:700" onclick="pv='buscar';q='${esc(s.n).replace(/'/g,"")}';selSt=${PRIV.students.indexOf(s)};render()">${esc(s.n)}${s.i?' <span class="pill p-a">Inc.</span>':""}</td><td style="text-align:center;${s.areas.length>=3?'background:#FFC7CE;':''}"><b>${s.areas.length}</b></td><td style="text-align:center">${s.areas.reduce((a,x)=>a+x.s.length,0)}</td><td class="small">${s.areas.map(a=>`<b>${esc(a.a)}</b> (${a.p.toFixed(1)}): ${a.s.map(y=>esc(y[0])+" "+(+y[1]).toFixed(1)).join(", ")}`).join("<br>")}</td></tr>`).join("")}</table></div>
  <button class="btn sec noprint" style="margin-top:10px" onclick="window.print()">🖨️ Imprimir</button></div>`;
  return h;
}
function render(){
  const v={curso:vCurso,docente:vDocente,grado:vGrado,salon:vSalon,ahora:vAhora,privado:vPrivado}[tab];
  $("#app").innerHTML=v();window.scrollTo&&0;
}
navDraw();render();
</script>
