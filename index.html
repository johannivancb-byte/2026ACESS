 document.getElementById("vw").innerHTML=[["curso","📚 Cursos"],["docente","👩‍🏫 Docentes"],["salon","🏫 Salones"]].map(([k,l])=>`<button class="${k===view?'on':''}" onclick="view='${k}';draw()">${l}</button>`).join("");
 document.getElementById("dy").innerHTML=PUB.days.map((d,i)=>`<button class="${i===day?'on':''}" onclick="day=${i};draw()">${d.replace(" nov","")}</button>`).join("");
 const rows=view==="curso"?COURSES:view==="docente"?TEACH:ROOMS;
 const lab=r=>view==="curso"?`${r}<small>Salón base ${PUB.courses[r].base}</small>`:view==="docente"?esc(r):`Salón ${r}<small>${PUB.rooms[r].grade} · ${PUB.rooms[r].type}</small>`;
 const fn=view==="curso"?courseCell:view==="docente"?teachCell:roomCell;
 const nq=norm(q.trim());
 const isNow=b=>N&&N[0]===day&&N[1]===b;
 let h=`<thead><tr><th class="rl">${view==="curso"?"Curso":view==="docente"?"Docente":"Salón"}</th>`;
 PUB.hours.forEach((x,b)=>{if(b===2)h+=`<th class="desc">8:50 DESCANSO</th>`;h+=`<th class="${isNow(b)?'now':''}">${isNow(b)?"🔴 AHORA · ":""}${x}</th>`});
 h+=`</tr></thead><tbody>`;
 for(const r of rows){const row=[0,1,2,3].map(b=>fn(r,day*4+b));
  if(nq&&!norm(r).includes(nq)&&!norm(row.join(" ").replace(/<[^>]+>/g," ")).includes(nq))continue;
  h+=`<tr><th>${lab(r)}</th>`;row.forEach((c,b)=>{if(b===2)h+=`<td class="desc"></td>`;h+=`<td class="${isNow(b)?'nowc':''} ${day===0?'done':''}">${c}</td>`});h+=`</tr>`}
 document.getElementById("t").innerHTML=h+"</tbody>";
}
document.getElementById("q").oninput=e=>{q=e.target.value;draw()};
draw();
</script></body></html>
